`,"../content/example/01-about-the-api/authentication.md":`# Authentication

The Acme API uses [API keys](https://en.wikipedia.org/wiki/API_key) to authenticate requests. You can view and manage your API keys in the Dashboard.

Test keys and live keys are shown separately in the Dashboard.

Your API keys carry many privileges, so be sure to keep them secure! Do not share your secret API keys in publicly accessible areas such as GitHub or client-side code.

Authentication to the API is performed with HTTP Basic Auth. Provide your API key as the basic auth username value. You do not need to provide a password.

## Example

\`\`\`bash title="Authenticated request"
curl https://api.acme.dev/v1/customers \\
  -u YOUR_API_KEY:
\`\`\`

\`\`\`js
import Acme from 'acme';
const acme = new Acme('YOUR_API_KEY');
\`\`\`

\`\`\`python
import acme
acme.api_key = "YOUR_API_KEY"
\`\`\`

> **Warning:** All API requests must be made over HTTPS. Calls made over plain HTTP will fail.
`,"../content/example/01-about-the-api/errors.md":`# Errors

Acme uses conventional HTTP response codes to indicate the success or failure of an API request. In general: codes in the \`2xx\` range indicate success. Codes in the \`4xx\` range indicate an error that failed given the information provided (e.g., a required parameter was omitted). Codes in the \`5xx\` range indicate an error with our servers.

::: right HTTP status code summary
| Code | Meaning |
|---|---|
| \`200\` OK | Everything worked as expected. |
| \`400\` Bad Request | The request was unacceptable, often due to a missing parameter. |
| \`401\` Unauthorized | No valid API key provided. |
| \`402\` Request Failed | The parameters were valid but the request failed. |
| \`404\` Not Found | The requested resource doesn't exist. |
| \`429\` Too Many Requests | Too many requests hit the API too quickly. |
| \`500\` Server Errors | Something went wrong on our end. |
:::

## Attributes

- \`code\` (string, nullable)
  For some errors that could be handled programmatically, a short string indicating the error code reported.

- \`message\` (string, nullable)
  A human-readable message providing more details about the error.

- \`param\` (string, nullable)
  If the error is parameter-specific, the parameter related to the error.

- \`type\` (enum)
  The type of error returned.
  Possible enum values:
  - \`api_error\`
    API errors cover any other type of problem (e.g., a temporary problem with our servers).
  - \`card_error\`
    Card errors are the most common type of error you should expect to handle.
  - \`invalid_request_error\`
    Invalid request errors arise when your request has invalid parameters.
`,"../content/example/01-about-the-api/pagination.md":`# Pagination

All top-level API resources have support for bulk fetches through "list" API methods. For example, you can [list customers](../02-core-resources/customers/5-list.md). These list API methods share a common structure and accept, at a minimum, the following three parameters: \`limit\`, \`starting_after\`, and \`ending_before\`.

## Response

\`\`\`json
{
  "object": "list",
  "url": "/v1/customers",
  "has_more": false,
  "data": [
    { "id": "cus_4QFJOjw2pOmAGJ", "object": "customer" }
  ]
}
\`\`\`

## Parameters

- \`limit\` (integer, optional)
  A limit on the number of objects to be returned, between 1 and 100. Defaults to 10.

- \`starting_after\` (string, optional)
  A cursor for use in pagination. \`starting_after\` is an object ID that defines your place in the list.

- \`ending_before\` (string, optional)
  A cursor for use in pagination. \`ending_before\` is an object ID that defines your place in the list.

# Charges

The \`Charge\` object represents a single attempt to move money into your account. PaymentIntent confirmation is the most common way to create Charges.

## The Charge object

### Response

\`\`\`json
{
  "id": "ch_3MmlLrLkdIwHu7ix0snN0B15",
  "object": "charge",
  "amount": 1099,
  "currency": "usd",
  "customer": null,
  "status": "succeeded"
}
\`\`\`

### Attributes

- \`id\` (string)
  Unique identifier for the object.

- \`amount\` (integer)
  Amount intended to be collected, in the smallest currency unit.

- \`currency\` (enum)
  Three-letter ISO currency code, in lowercase.

- \`customer\` (string, nullable, expandable)
  ID of the customer this charge is for if one exists.

- \`status\` (enum)
  The status of the payment.
  Possible enum values:
  - \`succeeded\`
    The charge succeeded.
  - \`pending\`
    The charge is still being processed.
  - \`failed\`
    The charge failed.

## Create a charge
\`POST /v1/charges\`

> [!WARNING]
> Use the Payment Intents API to initiate a new payment instead of using this method.

### Request

\`\`\`bash
curl https://api.acme.dev/v1/charges \\
  -u "YOUR_API_KEY:" \\
  -d amount=1099 \\
  -d currency=usd \\
  -d source=tok_visa
\`\`\`

\`\`\`js
const charge = await acme.charges.create({
  amount: 1099,
  currency: 'usd',
  source: 'tok_visa',
});
\`\`\`

### Response

\`\`\`json
{
  "id": "ch_3MmlLrLkdIwHu7ix0snN0B15",
  "object": "charge",
  "amount": 1099,
  "currency": "usd",
  "status": "succeeded"
}
\`\`\`

### Parameters

- \`amount\` (integer, required)
  Amount intended to be collected, in the smallest currency unit (e.g., 100 cents to charge $1.00).

- \`currency\` (enum, required)
  Three-letter ISO currency code, in lowercase.

- \`customer\` (string, optional)
  The ID of an existing customer that will be charged in this request.

- \`description\` (string, optional)
  An arbitrary string which you can attach to a Charge object.

### Returns

Returns the charge object if the charge succeeded.

## Retrieve a charge
\`GET /v1/charges/:id\`

Retrieves the details of a charge that has previously been created.

### Request

\`\`\`bash
curl https://api.acme.dev/v1/charges/ch_3MmlLrLkdIwHu7ix0snN0B15 \\
  -u "YOUR_API_KEY:"
\`\`\`

\`\`\`js
const charge = await acme.charges.retrieve('ch_3MmlLrLkdIwHu7ix0snN0B15');
\`\`\`

## Response

\`\`\`json
{
  "id": "cus_NffrFeUfNV2Hib",
  "object": "customer",
  "address": null,
  "balance": 0,
  "created": 1680893993,
  "email": "jennyrosen@example.com",

## Attributes

- \`id\` (string)
  Unique identifier for the object.

- \`address\` (object, nullable)
  The customer's address.

  - \`address.city\` (string, nullable)
    City, district, suburb, town, or village.

  - \`address.country\` (string, nullable)
    Two-letter country code ([ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).

  - \`address.line1\` (string, nullable)
    Address line 1 (e.g., street, PO Box, or company name).

  - \`address.postal_code\` (string, nullable)
    ZIP or postal code.

- \`email\` (string, nullable)
  The customer's email address.

- \`metadata\` (map)
  Set of key-value pairs that you can attach to an object.

- \`name\` (string, nullable)
  The customer's full name or business name.

## More attributes

- \`object\` (string)
  String representing the object's type. Always has the value \`customer\`.

- \`balance\` (integer)
  The current balance, if any, that's stored on the customer.

- \`created\` (timestamp)
  Time at which the object was created. Measured in seconds since the Unix epoch.

- \`livemode\` (boolean)
  Has the value \`true\` if the object exists in live mode.

- \`tax_exempt\` (enum, nullable)
  Describes the customer's tax exemption status.
  Possible enum values:
  - \`none\`
  - \`exempt\`
  - \`reverse\`
`,"../content/example/02-core-resources/customers/2-create.md":`# Create a customer
\`POST /v1/customers\`

Creates a new customer object.

## Request

\`\`\`bash
curl https://api.acme.dev/v1/customers \\
  -u "YOUR_API_KEY:" \\
  -d "name=Jenny Rosen" \\
  --data-urlencode "email=jennyrosen@example.com"
\`\`\`

\`\`\`js
const acme = require('acme')('YOUR_API_KEY');

const customer = await acme.customers.create({
  name: 'Jenny Rosen',
  email: 'jennyrosen@example.com',
});
\`\`\`

\`\`\`python
import acme
acme.api_key = "YOUR_API_KEY"

customer = acme.Customer.create(
  name="Jenny Rosen",
  email="jennyrosen@example.com",
)
\`\`\`

### Response

\`\`\`json
{
  "id": "cus_NffrFeUfNV2Hib",
  "object": "customer",
  "address": null,
  "balance": 0,
  "created": 1680893993,
  "email": "jennyrosen@example.com",
  "livemode": false,
  "metadata": {},
  "name": "Jenny Rosen",
  "tax_exempt": "none"
}
\`\`\`

## Parameters

- \`address\` (object, required if calculating taxes)
  The customer's address.

  - \`address.city\` (string, optional)
    City, district, suburb, town, or village.

  - \`address.country\` (string, optional)
    Two-letter country code.

  - \`address.line1\` (string, optional)
    Address line 1.

  - \`address.postal_code\` (string, optional)
    ZIP or postal code.

- \`description\` (string, optional)
  An arbitrary string that you can attach to a customer object.

- \`email\` (string, optional)
  Customer's email address. This may be up to *512 characters*.

- \`metadata\` (map, optional)
  Set of key-value pairs that you can attach to an object.

- \`name\` (string, optional)
  The customer's full name or business name.

## More parameters

- \`balance\` (integer, optional)
  An integer amount in cents that represents the customer's current balance.

- \`phone\` (string, optional)
  The customer's phone number.

- \`preferred_locales\` (array of strings, optional)
  Customer's preferred languages, ordered by preference.

- \`tax_exempt\` (enum, optional)
  The customer's tax exemption.
  Possible enum values:
  - \`none\`
  - \`exempt\`
  - \`reverse\`

## Returns

Returns the Customer object after successful customer creation. Raises [an error](../../01-about-the-api/errors.md) if create parameters are invalid.
`,"../content/example/02-core-resources/customers/3-update.md":`# Update a customer
\`POST /v1/customers/:id\`

Updates the specified customer by setting the values of the parameters passed. Any parameters not provided will be left unchanged.

## Request

\`\`\`bash
curl https://api.acme.dev/v1/customers/cus_NffrFeUfNV2Hib \\
  -u "YOUR_API_KEY:" \\
  -d "metadata[order_id]"=6735
\`\`\`

\`\`\`js
const customer = await acme.customers.update('cus_NffrFeUfNV2Hib', {
  metadata: { order_id: '6735' },
});
\`\`\`

\`\`\`python
customer = acme.Customer.modify(
  "cus_NffrFeUfNV2Hib",
  metadata={"order_id": "6735"},
)
\`\`\`

### Response

\`\`\`json
{
  "id": "cus_NffrFeUfNV2Hib",
  "object": "customer",
  "metadata": { "order_id": "6735" }
}
\`\`\`

## Parameters

- \`description\` (string, optional)
  An arbitrary string that you can attach to a customer object.

- \`email\` (string, optional)
  Customer's email address.

- \`metadata\` (map, optional)
  Set of key-value pairs that you can attach to an object.

## Returns

Returns the customer object if the update succeeded.
`,"../content/example/02-core-resources/customers/4-retrieve.md":`# Retrieve a customer
\`GET /v1/customers/:id\`

Retrieves a Customer object.

## Request

\`\`\`bash
curl https://api.acme.dev/v1/customers/cus_NffrFeUfNV2Hib \\
  -u "YOUR_API_KEY:"
\`\`\`

\`\`\`js
const customer = await acme.customers.retrieve('cus_NffrFeUfNV2Hib');
\`\`\`

\`\`\`python
customer = acme.Customer.retrieve("cus_NffrFeUfNV2Hib")

`,"../content/example/02-core-resources/customers/5-list.md":`# List all customers
\`GET /v1/customers\`

Returns a list of your customers. The customers are returned sorted by creation date, with the most recent customers appearing first. See [pagination](../../01-about-the-api/pagination.md).

## Request

\`\`\`bash
curl -G https://api.acme.dev/v1/customers \\
  -u "YOUR_API_KEY:" \\
  -d limit=3
\`\`\`

\`\`\`js
const customers = await acme.customers.list({ limit: 3 });
\`\`\`

\`\`\`python
customers = acme.Customer.list(limit=3)
\`\`\`

### Response

\`\`\`json
{
  "object": "list",
  "url": "/v1/customers",
  "has_more": false,
  "data": [
    {
      "id": "cus_NffrFeUfNV2Hib",
      "object": "customer",
      "email": "jennyrosen@example.com",
      "name": "Jenny Rosen"
    }
  ]
}
\`\`\`

## Parameters

- \`email\` (string, optional)
  A case-sensitive filter on the list based on the customer's \`email\` field.

- \`limit\` (integer, optional)
  A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 10.

- \`starting_after\` (string, optional)
  A cursor for use in pagination.

## Returns

A dictionary with a \`data\` property that contains an array of up to \`limit\` customers.

# Introduction

The Acme API is organized around [REST](https://en.wikipedia.org/wiki/Representational_state_transfer). It has predictable resource-oriented URLs, accepts **form-encoded** request bodies, returns **JSON-encoded** responses, and uses standard HTTP response codes, authentication, and verbs.

You can use the Acme API in test mode, which doesn't affect your live data. The [API key](01-about-the-api/authentication.md) you use to authenticate the request determines whether the request is live mode or test mode.

![How a request flows through the API](images/request-flow.svg)

## Example

\`\`\`text title="Base URL"
https://api.acme.dev
\`\`\`

::: right Client libraries
- [Node.js](https://github.com/)
- [Python](https://github.com/)
- [Ruby](https://github.com/)
- [Go](https://github.com/)
:::

> [!NOTE]
> The Acme API doesn't support bulk updates. You can work on only one object per request.

# Folders & files

The sidebar is built from your folder. You don't need a menu file or any settings.

## Folders become groups

Each folder inside your docs folder becomes a **group** in the sidebar, with the folder name as its title.

- Numbers at the start of a name (\`01-\`, \`02-\`) set the **order**. They are hidden in the sidebar.
- Dashes and underscores become spaces: \`02-core-resources\` → **Core Resources**.
- Files in the main folder (not in any subfolder) appear at the very top, without a group title.
- A folder **inside** a group folder is a **resource**: its files become the sections of one sidebar item. See [One folder per resource](#one-folder-per-resource).

::: right Your folder
\`\`\`text
my-docs/
├── README.md
├── 01-about-the-api/
│   ├── 1-authentication.md
│   └── 2-errors.md
└── 02-core-resources/
    ├── customers.md
    └── orders.md
\`\`\`
:::

::: right Sidebar you get
\`\`\`text
Introduction

ABOUT THE API
  Authentication
  Errors

CORE RESOURCES
  Customers
  Orders
\`\`\`
:::

## Files become pages

Each \`.md\` file is one **page** in the sidebar.

- **Name:** the first \`# heading\` in the file. If there is none, the file name is used: \`list-pets.md\` → **List Pets**.
- **Order:** the \`order:\` setting, then a number at the start of the file name, then A to Z.
- **README.md** or **index.md** in the main folder becomes the first page, **Introduction**.
- **Images** (png, jpg, gif, svg, webp) in your folder can be shown on pages. See [Images](../03-layout/text-formatting.md#images).
- Other files are ignored. Hidden folders (starting with a dot) and \`node_modules\` are skipped.

::: right Name and order examples
\`\`\`text
File name               Sidebar name
─────────────────────   ─────────────────
customers.md            Customers  (or its # title)
01-quick-start.md       Quick Start  (shown first)
payment_methods.md      Payment Methods
api-keys.md             API Keys
\`\`\`
:::

## Name a group with _meta.md

Want a group name that a folder name can't give you, like **About the API**? Add a file named \`_meta.md\` inside that folder. It holds only settings and is never shown as a page.

| Setting | What it does |
|---|---|
| \`title\` | The group name in the sidebar |
| \`order\` | The group position (smaller numbers come first) |

A \`_meta.md\` in the **main** folder can also set \`site\` (the name at the top left) and \`version\` (the label in the top bar). See [Page settings](page-settings.md).

::: right What you write: 01-about-the-api/_meta.md
\`\`\`markdown
---
title: About the API
order: 1
---
\`\`\`
:::

## One folder per resource

This is the easiest layout for teams: **one file per endpoint**. Put a folder for the resource inside a group folder:

- \`index.md\` (or \`README.md\`) is the resource's overview. Its **Endpoints** list is made for you.
- Every other file is **one section**, written exactly like [Copy for LLM](the-standard.md) gives it: \`# Create a customer\`, then \`## Request\`, \`## Parameters\`, …
- Numbers at the start of the file names set the order. Links look like \`#customers/create\`.

::: right A resource folder
\`\`\`text
02-core-resources/            → group "Core Resources"
└── customers/                → sidebar item "Customers"
    ├── index.md              → overview + Endpoints list
    ├── 1-object.md           → The Customer object
    ├── 2-create.md           → Create a customer
    └── 3-update.md           → Update a customer
\`\`\`
:::
`,"../content/guide/01-basics/page-settings.md":'---\ntitle: Page settings\norder: 2\n---\n# Page settings\n\nA page can start with a small **settings block** (also called "frontmatter"): a few `key: value` lines between two `---` lines. It is **optional**. Use it only when you want to change something that the viewer works out on its own.\n\n## How to write it\n\n- It must be the **very first thing** in the file. Nothing, not even an empty line, can come before the first `---`.\n- Write one setting per line: `key: value`.\n- Text after `#` is a comment and is ignored.\n\n::: right What you write: orders.md\n```markdown\n---\ntitle: Orders      # name in the sidebar\norder: 3           # position in its group\n---\n# Orders\n\nAn order is a list of products a customer buys.\n```\n:::\n\n## All settings\n\n| Setting | Use it in | What it does | Example |\n|---|---|---|---|\n| `title` | any page | Page name (instead of the first `#` heading) | `title: Orders` |\n| `order` | any page, `_meta.md` | Position; smaller numbers come first | `order: 2` |\n| `group` | any page | Puts the page in a group with this name, whatever its folder | `group: Billing` |\n| `slug` | any page | The page\'s name in links | `slug: pets` gives `#pets/...` |\n| `site` | main `README.md` or `_meta.md` | The name at the top left | `site: Acme API` |\n| `version` | main `README.md` or `_meta.md` | The version label in the top bar | `version: 2026-09-01` |\n\n::: right What you write: README.md (main folder)\n```markdown\n---\nsite: Acme API\nversion: 2026-09-01\n---\n# Introduction\n\nWelcome to the Acme API.\n```\n:::\n',"../content/guide/01-basics/templates.md":`---

# Templates

Six starting files, one for each kind of page. Each is already in [the standard](the-standard.md). Click **Try it** to open one in the playground, or **Copy** to paste it into a new file.

## Endpoint

One call of your API, for example *Create a pet*. Save it as \`create.md\` inside the resource folder (layout A), or paste it into a page and change the headings to \`##\` / \`###\` (layout B).

::: right create.md
\`\`\`\`markdown
# Create a pet
\`POST /v1/pets\`

Creates a new pet for one of your customers.

## Request

\`\`\`curl
curl https://api.example.com/v1/pets \\
  -u YOUR_API_KEY: \\
  -d name=Milo \\
  -d species=cat
\`\`\`

\`\`\`node
const pet = await client.pets.create({ name: 'Milo', species: 'cat' });
\`\`\`

\`\`\`python
pet = client.pets.create(name="Milo", species="cat")
\`\`\`

### Response

\`\`\`json
{
  "id": "pet_1",
  "object": "pet",
  "name": "Milo",
  "species": "cat"
}
\`\`\`

## Parameters

- \`name\` (string, required)
  The pet's name.

- \`species\` (enum, optional)
  What kind of animal it is.
  Possible enum values:
  - \`cat\`
  - \`dog\`
  - \`bird\`

- \`owner\` (object, optional)
  Who looks after the pet.

  - \`owner.name\` (string, optional)
    The owner's full name.

  - \`owner.email\` (string, optional)
    The owner's email address.

## More parameters

- \`metadata\` (map, optional)
  Key-value pairs you can attach to the pet.

## Returns

The Pet object, if the call succeeded.
\`\`\`\`
:::

## Object

What an object looks like: its attributes and an example. Save it as \`object.md\`, usually the first file of the resource.

::: right object.md
\`\`\`\`markdown
# The Pet object

## Response

\`\`\`json
{
  "id": "pet_1",
  "object": "pet",
  "name": "Milo",
  "species": "cat",
  "created": 1680893993
}
\`\`\`

## Attributes

- \`id\` (string)
  Unique identifier for the pet.

- \`name\` (string)
  The pet's name.

- \`species\` (enum)
  What kind of animal it is.
  Possible enum values:
  - \`cat\`
  - \`dog\`
  - \`bird\`

## More attributes

- \`object\` (string)
  Always has the value \`pet\`.

- \`created\` (timestamp)
  When the pet was created, in seconds since the Unix epoch.
\`\`\`\`

A row in \`user_groups\` can point to a user that was deleted. Such rows break the group pages.

# The standard

**Doc Standard v1** is the one way to write pages for this viewer. It is plain Markdown with a few conventions, so your files stay readable anywhere.

The promise is simple:

1. **What you write** is what the page shows.
2. **Copy for LLM** gives you back exactly that format.
3. Paste that Markdown into a new file, change the words, and you get the same layout.

So any section you like is a template: click **Copy for LLM**, paste, change, done.

::: right One section = one file (create.md)
\`\`\`\`markdown
# Create a pet
\`POST /v1/pets\`

Creates a new pet.

## Request

\`\`\`curl
curl https://api.example.com/v1/pets -d name=Milo
\`\`\`

### Response

\`\`\`json
{ "id": "pet_1", "name": "Milo" }
\`\`\`

## Parameters

- \`name\` (string, required)
  The pet's name.

## Returns

The Pet object.
\`\`\`\`
:::

## The parts of a section

A section is a title, then parts. Each part has a fixed name, and the name decides where it goes on the page.

| Part | Where it shows | What goes in it |
|---|---|---|
| \`# Title\` | top of the section | the section name |
| \`\` \`POST /v1/pets\` \`\` right under the title | endpoint box (right) | method and path |
| the first paragraph | under the title | a one-line description |
| \`## Request\` | code column | one code block per language (they become tabs) |
| \`### Response\` | code column | the JSON that comes back (several = tabs) |
| \`## Parameters\` | text column | the parameter list |
| \`## More parameters\` | text column, collapsed | less-used parameters |
| \`## Attributes\` / \`## More attributes\` | text column | the fields of an object |
| \`## Returns\` | text column | what the call gives back |
| \`## Endpoints\` | code column | made for you on overview pages; you can leave it out |

**Heading levels:** in a file with **one** section, write the parts with \`##\` (as above). In a page with **many** sections, the sections use \`##\` and their parts use \`###\`. Both mean the same thing: a heading with a part name never starts a new section.

## The parameter line

Every parameter is one bullet in the same shape:

\`\`\`text
- \`name\` (type, required)
  Description on the next line, indented 2 spaces.
\`\`\`

- In the brackets: the **type**, then \`required\`, \`required if …\` or \`optional\`, then any of \`nullable\`, \`expandable\`, \`deprecated\`.
- Object **attributes** leave out \`optional\`: \`\` - \`id\` (string) \`\`.
- **Child parameters** are indented under their parent, with a dotted name: \`\` - \`address.city\` (string, optional) \`\`.
- **Enum values** come right under the description: a line \`Possible enum values:\` and one bullet per value.

::: right Parameter line
\`\`\`markdown
## Parameters

- \`address\` (object, required if calculating taxes)
  The customer's address.

  - \`address.city\` (string, optional)
    City or town.

- \`tax_exempt\` (enum, optional)
  The customer's tax exemption.
  Possible enum values:
  - \`none\`
  - \`exempt\`
\`\`\`
:::

## Two ways to organize files

Both give the same page. Pick one per resource.

**A. One file per endpoint**. A folder inside a group folder is one resource. Its \`index.md\` is the overview; every other file is one section. Links look like \`#customers/create\`.

**B. One file per resource.** One file holds the overview and all sections: \`## Create a customer\`, \`## Update a customer\`, … with \`###\` parts.

The example docs use both: *Customers* is layout A, *Charges* is layout B.

::: right A. One file per endpoint
\`\`\`text
docs/
└── 02-core-resources/        → group "Core Resources"
    └── customers/            → resource "Customers"
        ├── index.md          → overview + Endpoints list
        ├── 1-object.md       → "The Customer object"
        ├── 2-create.md       → "Create a customer"
        └── 3-update.md       → "Update a customer"
\`\`\`
:::

::: right B. One file per resource
\`\`\`text
docs/
└── 02-core-resources/
    └── customers.md          → # Customers
                                  ## The Customer object
                                  ## Create a customer
                                  ## Update a customer
\`\`\`
:::

## Tools that keep you on the standard

- **Copy for LLM** (top right of every section) copies the section in the standard, ready for an AI tool.
- The **doc checker** (the ✓ / ⚠ button in the top bar) lists anything that doesn't follow the standard, with the file, the line and how to fix it.
- **Convert to standard** (in the doc checker) shows what it will change: which problems it fixes, each change with the old and new words side by side, and a **Preview** of the page. Click **Save** to write it to the file.
- The **[playground](#playground)** lets you write Markdown and see the page at once.
- **[Templates](templates.md)** give you a correct starting file for each kind of page.

## Compared with plain API-reference Markdown

The standard adds a few things to the usual API-reference format, so that nothing is lost when it is read back:

- all code languages are kept (many exports keep only cURL);
- \`## More parameters\` is kept, and your order is kept (many tools merge and sort);
- code box titles are written as \`title="…"\`, and right-column boxes as \`::: right Title\`;
- the \`\` \`METHOD /path\` \`\` line is kept under the title.

Older ways of writing (for example \`\` - \`name\` string — text \`\`) still work, but the doc checker suggests the standard form, and **Convert to standard** rewrites them for you.

(#sections).\n\n## Underlined headings\n\nStandard Markdown also lets you write a heading by underlining it: a line of `===` under the text is a `#` heading, and a line of `---` is a `##` heading. The viewer reads both correctly.\n\nThe standard uses `#` and `##`, because they are clearer: a `---` line is also a **divider** when it comes after an empty line. The doc checker suggests the `#` form, and **Convert to standard** rewrites underlined headings for you.\n\n::: right Both are the same heading\n```markdown\nCreate a customer\n-----------------\n\n## Create a customer\n```\n:::\n\n::: right But this is a divider (empty line before ---)\n```markdown\nSome text.\n\n---\n```\n:::\n\n## Special heading names\n\nA heading with one of these **part names** never starts a new section, whatever its level (`##`, `###`…). It switches on a special layout for what follows. Every other `###` or `####` is a normal smaller heading.\n\n| Heading | What happens |\n|---|---|\n| `Parameters` | The next bullet list becomes parameter rows |\n| `Attributes`, `Properties`, `Fields`, `Arguments` | Same, labelled for objects |\n| `Query parameters`, `Path parameters`, `Body parameters`, `Headers`, `Request body` | Same, with that title |\n| `More parameters` / `More attributes` | A collapsed list with \"Expand all\" |\n| `Returns` | A Returns block with a line above it |\n| `Response`, `Example response` | The next code blocks become the Response box |\n| `Request`, `Example`, `Examples` | Hidden; the code under it goes to the code column |\n| `Endpoints` | Hidden; the list under it is made for you on overview pages |\n\nUpper or lower case doesn't matter, and a `:` at the end is fine. In a file with one section, write parts as `## Parameters`; inside a page with many sections, as `### Parameters`. See [the standard](the-standard.md).\n\n## Links\n\n| To link to | Write |\n|---|---|\n| another page | `[Errors](errors.md)` |\n| a page in another folder | `[Errors](../01-about-the-api/errors.md)` |\n| a section on another page | `[Create](customers.md#create-a-customer)` |\n| a section on this page | `[see below](#links)` |\n| a website | `[Example](https://example.com)` (opens in a new tab) |\n\nLinks are relative to the file you are writing in, just like on GitHub. Example: [Folders & files](folders-and-files.md), [Parameters](../02-endpoints/parameters.md).\n\n::: right What you write\n```markdown\nExample: [Folders & files](folders-and-files.md),\n[Parameters](../02-endpoints/parameters.md).\n```\n:::\n","../content/guide/02-endpoints/_meta.md":`---

h on the **first line right after** a `##` heading. It becomes the header of the first code box, with the method in color. A small copy also appears under the section title.\n\n- Methods: `GET`, `POST`, `PUT`, `PATCH`, `DELETE`, `HEAD`, `OPTIONS`.\n- Path variables like `:id` or `{id}` are highlighted.\n- You can put the line in backticks if you prefer: `` `GET /v1/pets` ``.\n- If the section has no code, the endpoint box is shown on its own.\n\nSee the full example in [Complete endpoint example](complete-example.md).\n\n::: right What you write\n```markdown\n## Get a pet\nGET /v1/pets/:id\n\nRetrieves one pet by its ID.\n```\n:::\n\n## Long code\n\nA box with more than 26 lines is cut short, with an **Expand** button, so it doesn\'t push the page down. The Copy button always copies all of it.\n',"../content/guide/02-endpoints/complete-example.md":`---

# Complete endpoint example

This is the example to copy. The two sections below, **List all pets** and **Get a pet**, are made from the Markdown in the box on the right. Copy it into a file named \`pets.md\`, change the names, and you have your first API page.

How each part works:

1. \`## Get a pet\` starts a section. It gets its own sidebar item and link.
2. \`\` \`GET /v1/pets/:id\` \`\` on the **next line** becomes the endpoint box. \`:id\` is highlighted.
3. The first paragraph is the description.
4. \`### Request\` and code blocks go to the code column. Several in a row become **tabs**.
5. \`### Response\` and a JSON block become the **Response** box. Several become tabs (\`title="200"\`, \`title="404"\`).
6. \`### Parameters\` and a bullet list become parameter rows.
7. \`### Returns\` explains what comes back.

Because this page has more than one endpoint, an **Endpoints** list appears on the right automatically.

**Prefer one file per endpoint?** Put each section in its own file inside a \`pets/\` folder: \`pets/index.md\`, \`pets/list.md\`, \`pets/get.md\`. Each file starts with \`# List all pets\` and uses \`##\` for its parts. Click **Copy for LLM** on a section below to get exactly that file.

\`\`\`

    { "id": "pet_2", "name": "Rex", "species": "dog" }
  ]
}
\`\`\`

  How many pets to return, from 1 to 100. Default is 10.

- \`species\` (enum, optional)

  - \`dog\`
  - \`bird\`

A list of pet objects.

\`\`\`

pet = client.pets.retrieve("pet_1")
\`\`\`

# Parameters

A parameter list is an ordinary **bullet list** under a heading named \`Parameters\`. The same works for \`Attributes\`, \`Properties\`, \`Fields\`, \`Arguments\`, \`Query parameters\`, \`Path parameters\`, \`Body parameters\`, \`Headers\` and \`Request body\`.

In a file with one section the heading is \`## Parameters\`; inside a page with many sections it is \`### Parameters\` (like on this page). Every section below shows the result in the middle and the Markdown on the right.

## The basic line

Each parameter is one bullet: the **name in backticks**, the **type in brackets**, and the **description on the next line**, indented 2 spaces.

### Parameters

- \`email\` (string, optional)
  The customer's email address.

- \`quantity\` (integer, optional)
  How many to order.

::: right What you write
\`\`\`markdown
### Parameters

- \`email\` (string, optional)
  The customer's email address.

- \`quantity\` (integer, optional)
  How many to order.
\`\`\`
:::

## Required and optional

Inside the brackets, after the type, add words **separated by commas**:

- \`required\` shows a red **Required**.
- \`required if …\` (or \`recommended if …\`) is shown exactly as you write it.
- \`optional\` shows nothing (it's the default for parameters).
- \`nullable\`, \`expandable\`, \`deprecated\`, \`read-only\` and \`beta\` show a small grey tag.

### Parameters

- \`amount\` (integer, required)
  Amount in cents.

- \`address\` (object, required if calculating taxes)
  The billing address.

- \`memo\` (string, optional)
  Shown on the receipt.

- \`customer\` (string, optional, nullable, expandable)
  The customer's ID.

- \`source\` (string, optional, deprecated)
  Use \`payment_method\` instead.

::: right What you write
\`\`\`markdown
### Parameters

- \`amount\` (integer, required)
  Amount in cents.

- \`address\` (object, required if calculating taxes)
  The billing address.

- \`memo\` (string, optional)
  Shown on the receipt.

- \`customer\` (string, optional, nullable, expandable)
  The customer's ID.

- \`source\` (string, optional, deprecated)
  Use \`payment_method\` instead.
\`\`\`
:::

## Nested parameters

Indent bullets under a parameter (**2 spaces**) to make **child parameters**. Write the child's name with its parent in front: \`address.city\`. They are hidden behind a "Show child parameters" button. You can nest as deep as you need.

### Parameters

- \`address\` (object, optional)
  The shipping address.

  - \`address.city\` (string, optional)
    City or town.

  - \`address.country\` (string, required)
    Two-letter country code.

  - \`address.location\` (object, optional)
    Map position.

    - \`address.location.lat\` (number, optional)
      Latitude.

    - \`address.location.lng\` (number, optional)
      Longitude.

- \`phone\` (string, optional)
  Phone number.

::: right What you write
\`\`\`markdown
### Parameters

- \`address\` (object, optional)
  The shipping address.

  - \`address.city\` (string, optional)
    City or town.

  - \`address.country\` (string, required)
    Two-letter country code.

  - \`address.location\` (object, optional)
    Map position.

    - \`address.location.lat\` (number, optional)
      Latitude.

    - \`address.location.lng\` (number, optional)
      Longitude.

- \`phone\` (string, optional)
  Phone number.
\`\`\`
:::

## Enum values

An enum is a parameter with a fixed list of allowed values. Write the type \`enum\`, the description, then a line \`Possible enum values:\` and one bullet per value. A value can have its own explanation on the next line.

### Parameters

- \`size\` (enum, optional)
  The shirt size.
  Possible enum values:
  - \`small\`
  - \`medium\`
  - \`large\`

- \`status\` (enum, optional)
  Where the order is now.
  Possible enum values:
  - \`pending\`
    Waiting for payment.
  - \`paid\`
    Payment received.
  - \`shipped\`
    On its way to the customer.

::: right What you write
\`\`\`markdown
### Parameters

- \`size\` (enum, optional)
  The shirt size.
  Possible enum values:
  - \`small\`
  - \`medium\`
  - \`large\`

- \`status\` (enum, optional)
  Where the order is now.
  Possible enum values:
  - \`pending\`
    Waiting for payment.
  - \`paid\`
    Payment received.
  - \`shipped\`
    On its way to the customer.
\`\`\`
:::

## Collapsed parameters

Put less-used parameters under \`More parameters\`. They start **collapsed**: readers click a name to open it, or use **Expand all**. This keeps long lists easy to scan.

### Parameters

- \`name\` (string, optional)
  The customer's full name.

### More parameters

- \`phone\` (string, optional)
  The customer's phone number.

- \`locale\` (string, optional)
  Preferred language, like \`en\` or \`fr\`.

::: right What you write
\`\`\`markdown
### Parameters

- \`name\` (string, optional)
  The customer's full name.

### More parameters

- \`phone\` (string, optional)
  The customer's phone number.

- \`locale\` (string, optional)
  Preferred language, like \`en\` or \`fr\`.
\`\`\`
:::

## Object attributes

To describe what an **object** contains (not what a request accepts), use \`Attributes\` and \`More attributes\`. Attributes leave out \`optional\`. Add an example object under \`Response\`; it appears on the right.

### Response

\`\`\`json
{ "id": "pet_1", "name": "Milo", "species": "cat" }
\`\`\`

### Attributes

- \`id\` (string)
  Unique identifier for the pet.

- \`name\` (string)
  The pet's name.

- \`species\` (enum)
  What kind of animal it is.
  Possible enum values:
  - \`cat\`
  - \`dog\`

::: right What you write
\`\`\`\`markdown
### Response

\`\`\`json
{ "id": "pet_1", "name": "Milo", "species": "cat" }
\`\`\`

### Attributes

- \`id\` (string)
  Unique identifier for the pet.

- \`name\` (string)
  The pet's name.

- \`species\` (enum)
  What kind of animal it is.
  Possible enum values:
  - \`cat\`
  - \`dog\`
\`\`\`\`
:::

## No parameters

If an endpoint takes no parameters, write a sentence under the heading instead of a list.

### Parameters

No parameters.

::: right What you write
\`\`\`markdown
### Parameters

No parameters.
\`\`\`
:::

## Older styles

Before the standard, parameters could also be written on one line. These still work, but the doc checker suggests the standard form, and **Convert to standard** rewrites them for you.

::: right Still accepted (not the standard)
\`\`\`markdown
- \`email\` string, required — The customer's email.
- **email** (string, required): The customer's email.
- \`size\` enum — The size. Values: \`small\`, \`large\`
\`\`\`
:::

> [!TIP]
> Every parameter is searchable. Press **Ctrl K** and type a name, or a path like \`address.city\`. The search opens the parameter and highlights it.

# Left & right columns

Every page has **three columns**. You decide very little yourself: the viewer puts each thing where it belongs.

| Column | What goes there | How it gets there |
|---|---|---|
| **1. Sidebar** | Groups, pages and sections | Automatic, from folders, files and \`##\` headings |
| **2. Middle** (text) | Text, lists, tables, notes, parameters, Returns | Everything that is **not** code |
| **3. Right** (dark) | Code, tabs, Response, endpoint box | Automatic for code, or \`::: right\` for anything else |

On small screens the right column moves **below** the text, and the sidebar opens with the ☰ button.

::: right The three columns
\`\`\`text
┌──────────┬────────────────────┬────────────────────┐
│ SIDEBAR  │ MIDDLE             │ RIGHT              │
│          │                    │                    │
│ Group    │ ## Section title   │ POST /v1/pets      │
│  Page    │ Text, lists,       │ ┌────────────────┐ │
│   Section│ tables, notes      │ │ code (tabs)    │ │
│   Section│                    │ └────────────────┘ │
│          │ ### Parameters     │ ┌────────────────┐ │
│ Group    │ - \`name\` string    │ │ Response       │ │
│  Page    │                    │ └────────────────┘ │
│          │ ### Returns        │ ::: right cards    │
└──────────┴────────────────────┴────────────────────┘
\`\`\`
:::

## Put anything on the right

Wrap any content in \`::: right\` and \`:::\` to move it to the right column: a table, a list, a note, even an image. Text after \`::: right\` becomes the card's **title**.

A code block inside \`::: right\` becomes a code box with that title. That is how the **Base URL** box on the example's first page is made.

::: right Rate limits
| Plan | Requests per second |
|---|---|
| Free | 25 |
| Pro | 100 |
:::

::: right Base URL
\`\`\`text
https://api.example.com
\`\`\`
:::

::: right What you write
\`\`\`\`markdown
::: right Rate limits
| Plan | Requests per second |
|---|---|
| Free | 25 |
| Pro | 100 |
:::

::: right Base URL
\`\`\`text
https://api.example.com
\`\`\`
:::
\`\`\`\`
:::

## Keep code in the text

Sometimes a short command belongs **inside** the steps, not on the right. Wrap it in \`::: left\` and \`:::\`.

1. Install the library:

::: left
\`\`\`bash
npm install acme
\`\`\`
:::

2. Add your API key to your settings.

::: right What you write
\`\`\`\`markdown
1. Install the library:

::: left
\`\`\`bash
npm install acme
\`\`\`
:::

2. Add your API key to your settings.
\`\`\`\`
:::

## Endpoint list on overview pages

The top part of a page (before the first \`##\`) automatically gets an **Endpoints** list on the right when the page has two or more endpoints, or one endpoint and nothing else on the right. Every row links to its section. In a resource folder, the overview (\`index.md\`) always gets it. See it on [Complete endpoint example](../02-endpoints/complete-example.md).

You don't write anything for this. It is built from the \`GET /…\` and \`POST /…\` lines in the page.

# Text formatting

All normal Markdown works. This page shows each piece next to its Markdown.

## Notes and warnings

Start a quote with \`[!NOTE]\`, \`[!TIP]\`, \`[!WARNING]\`, \`[!IMPORTANT]\` or \`[!CAUTION]\` to get a colored box. This is the same style GitHub uses.

> [!NOTE]
> Keep your API keys secret.

> [!WARNING]
> Never share your secret key.

> [!TIP]
> Press Ctrl K to search.

::: right What you write
\`\`\`markdown
> [!NOTE]
> Keep your API keys secret.

> [!WARNING]
> Never share your secret key.

> [!TIP]
> Press Ctrl K to search.
\`\`\`
:::

## Notes with your own title

Use \`::: note\`, \`::: tip\` or \`::: warning\` followed by your own title. A quote that starts with **Note:** or **Warning:** in bold also works.

::: tip Did you know?
Readers can link straight to any section. Just copy the address bar.
:::

> **Warning:** Deleted customers cannot be restored.

::: right What you write
\`\`\`markdown
::: tip Did you know?
Readers can link straight to any section. Just copy the address bar.
:::

> **Warning:** Deleted customers cannot be restored.
\`\`\`
:::

## Tables

Separate columns with \`|\`. The second line (\`---\`) marks the header. Put \`:\` on one or both sides of the dashes to align a column.

| Code | Meaning | Retry? |
|---|---|:-:|
| \`200\` | Everything worked | — |
| \`429\` | Too many requests | Yes |
| \`500\` | Server error | Yes |

::: right What you write
\`\`\`markdown
| Code | Meaning | Retry? |
|---|---|:-:|
| \`200\` | Everything worked | — |
| \`429\` | Too many requests | Yes |
| \`500\` | Server error | Yes |
\`\`\`
:::

## Lists

- Bullets start with \`-\`.
  - Indent 2 spaces to nest.
1. Numbered items start with \`1.\`.
2. The numbers can simply count up.

- [x] Task lists use \`[x]\` for done
- [ ] and \`[ ]\` for open

::: right What you write
\`\`\`markdown
- Bullets start with \`-\`.
  - Indent 2 spaces to nest.
1. Numbered items start with \`1.\`.
2. The numbers can simply count up.

- [x] Task lists use \`[x]\` for done
- [ ] and \`[ ]\` for open
\`\`\`
:::

## Text styles

**Bold**, *italic*, ~~crossed out~~, \`inline code\`, and a [link](https://example.com). A plain web address such as https://example.com becomes a link too.

::: right What you write
\`\`\`markdown
**Bold**, *italic*, ~~crossed out~~, \`inline code\`,
and a [link](https://example.com). A plain web address
such as https://example.com becomes a link too.
\`\`\`
:::

## Images

Put the image file in your docs folder and link to it **relative to the page**, just like links. The text in \`[ ]\` describes the image for screen readers.

![Diagram: your server calls the API, the API answers with JSON](../images/flow.svg)

::: right What you write
\`\`\`markdown
![Diagram: your server calls the API, the API answers with JSON](../images/flow.svg)
\`\`\`
:::

::: right Where the file is
\`\`\`text
my-docs/
├── images/
│   └── flow.svg
└── 03-layout/
    └── text-formatting.md   ← this page
\`\`\`
:::

## HTML

Simple HTML works inside Markdown, the same as on GitHub. Use \`<details>\` for a toggle that opens on click. Leave an **empty line** after \`<summary>\` and before \`</details>\` so the text inside is read as Markdown.

<details>
<summary>Why did my request fail?</summary>

Check the **status code** first:

- \`401\`: the key is missing or wrong.
- \`429\`: wait a moment and retry.

</details>

Small tags work inside a line too: press <kbd>Ctrl</kbd> + <kbd>K</kbd> to search, H<sub>2</sub>O, 10<sup>3</sup>, and <mark>highlighted</mark> text. Use \`<br>\` for a line break inside a table cell.

Tags that could run code or change the page, such as \`<script>\`, \`<style>\` and \`<iframe>\`, are shown as text. \`style\`, \`class\` and \`on…\` attributes are removed. \`\x3C!-- comments -->\` are hidden, so you can leave notes for other writers.

::: right What you write
\`\`\`markdown
<details>
<summary>Why did my request fail?</summary>

Check the **status code** first:

- \`401\`: the key is missing or wrong.
- \`429\`: wait a moment and retry.

</details>

Press <kbd>Ctrl</kbd> + <kbd>K</kbd> to search,
H<sub>2</sub>O, 10<sup>3</sup>, <mark>highlighted</mark>.
\`\`\`
:::

## Lines and breaks

A line of three dashes draws a divider:

---

An empty line starts a new paragraph. Lines that follow each other directly are joined into one paragraph.

::: right What you write
\`\`\`markdown
A line of three dashes draws a divider:

---

An empty line starts a new paragraph.
\`\`\`
:::

# Tips & troubleshooting

Something doesn't look right? First open the **doc checker**: the ✓ / ⚠ button in the top bar. It lists anything that doesn't follow [the standard](../01-basics/the-standard.md), with the file, the line and how to fix it. **Convert to standard** there shows a whole file rewritten for you, with the changes highlighted, and saves it when you click **Save**.

The table below explains the most common problems.

## Common problems

| Problem | Why | Fix |
|---|---|---|
| Code shows in the middle, not on the right | It is indented inside a list, or inside \`::: left\` | Start the code block at the beginning of the line, outside the list |
| Code blocks don't join into tabs | Two blocks use the same language, a block has a \`title="…"\` (a title always starts a new box), or there is text between them | Use one block per language, no title on the blocks you want as tabs, and nothing between them |
| The endpoint box is missing | The \`GET /path\` line is not the first line after the \`##\` heading | Move it right under the heading |
| A bullet shows as plain text, not a parameter | The name is not in backticks or bold | Start the bullet with the name in backticks |
| The list is not shown as parameters | The heading above it has another name | Use \`### Parameters\` (or Attributes, Fields…) |
| Enum values show as child parameters | The type is not \`enum\` and there is no \`Possible enum values:\` line | Write \`enum\` as the type, or put \`Possible enum values:\` right before the values |
| A page is in the wrong place | Pages are sorted A to Z by default | Add a number to the file name (\`01-…\`) or \`order:\` in [settings](../01-basics/page-settings.md) |
| The page title is the file name | There is no \`#\` heading on the first line | Add \`# Your title\` at the top |
| A settings block shows as text | Something comes before the first \`---\` | Make \`---\` the very first line of the file |
| An image doesn't show | The path is wrong, or the image is outside the chosen folder | Use a path relative to the page, and keep images inside your docs folder |
| Nothing happens after choosing a folder | The browser's question **“Let site view files?”** was cancelled | Choose the folder again and click **View files**. Still “Nothing was opened”? Click **Use the basic folder picker** in that message, or drag the folder onto the page |
| “No Markdown files found” | The chosen folder has no \`.md\` files | Pick the folder that contains them (subfolders are included), or use **Open a .md file** |
| My changes don't show | The browser still has the old files | Press **↻ Reload** in the top bar. In Firefox and Safari, choose the folder again |

## Keyboard shortcuts

| Keys | Does |
|---|---|
| **Ctrl K**, **⌘K** or **/** | Open search |
| **↑** **↓** and **Enter** | Move through results and open one |
| **Esc** | Close search or the mobile menu |

## Good habits

- **One resource per file** (\`customers.md\`, \`orders.md\`), with one \`##\` section per endpoint.
- Start each resource with **The X object** (its attributes and an example), then one section per endpoint.
- Keep the **first sentence** of each section short. It's what people read first, and what search shows.
- Give every endpoint at least a **cURL** example and a **Response**.
- Put rarely-used options under \`### More parameters\`.

## Privacy and browsers

- Your files **never leave your computer**. The viewer reads them in the browser; nothing is uploaded.
- **Chrome and Edge** remember the last folder or file ("Reopen …" on the start screen) and can reload it with one click.
- **One file** works too: **Open a .md file** (or drag it onto the page). Images next to a single file can't be shown, because the browser only gives access to that file. Open the folder for images.
- **Firefox and Safari** work too; you pick the folder again to reload.
- Your theme (light/dark) and preferred code language are remembered in this browser.
- \`index.html\` is one file. Copy it anywhere, for example next to your docs folder, and share both.

# Docs on GitHub

Your docs can live in a GitHub repository. Open a branch the way you open a folder, edit it here, and save your changes back as **one commit**. Everything runs in your browser. The viewer talks only to GitHub, and your token is never sent anywhere else.

## Connect

Click **Continue with GitHub** on the start page, or the branch icon in the top bar. GitHub asks for a **token**: a password made for one app, with only the rights you give it.

1. Click **Create token on GitHub**. A new tab opens on GitHub's *fine-grained token* page.
2. Give it a name and an expiration date.
3. Under **Repository access**, choose only the repositories that hold your docs.
4. Under **Permissions**, set **Contents** to *Read-only* to just read, or *Read and write* to save. Add **Pull requests: Read and write** if you want to open pull requests from here.
5. Click **Generate token**, copy it, and paste it into the viewer.

Tick **Remember me** to keep the token in this browser after you close the tab. Otherwise it's forgotten when the page closes. **Disconnect** removes it from the browser at once.

Public repositories open without a token: type \`owner/repo\` in the search box. You can read them, but saving needs a token.

## Open a repository

Pick a repository from the list, or type \`owner/repo\`, then choose a branch and click **Open**. The viewer reads the \`.md\` files and images on that branch, just like a folder. The same [folder rules](../01-basics/folders-and-files.md) apply.

The sidebar shows \`owner/repo @ branch\`. **↻ Reload** gets the latest version from GitHub. Next time, **Reopen** on the start page opens the same branch again.

## Edit and save

Edit a section with its **Edit** button, or use **Convert to standard** in the doc checker. **New file** in the **Files** view adds a page. Changes stay in your browser until you save them:

- A dot marks each changed file in the **Files** view.
- **Save to GitHub · N unsaved** in the top bar opens the save dialog.
- Closing the tab, reloading or opening other docs asks first, so edits aren't lost by accident.

The save dialog shows every change line by line. Check the **commit message**, add a **description** if you like, and click **Commit**. All changed files go into **one commit**, made by you. The message starts with \`docs:\` by default (change the prefix in the box on the left; it's remembered):

| Change | Message |
|---|---|
| One file edited | \`docs: update guides/setup.md\` |
| One file added | \`docs: add guides/setup.md\` |
| Several files | \`docs: update 3 files\`, with the list in the description |
| Convert to standard | \`docs: convert to Doc Standard v1\` |

Deleting and renaming files isn't possible here yet. Do those on GitHub or in your editor.

## When someone else changed the branch

Before committing, the viewer checks whether the branch moved since you opened it.

- **Other files changed:** your commit goes on top of theirs, and the viewer then shows the latest branch.
- **The same files changed:** you choose for each file. **Keep mine** replaces their change with yours. **Take theirs** drops your edit to that file. You can also **Save as new branch** and merge later.

The viewer never force-pushes, and it never overwrites a change without asking.

## When saving is refused

| Message | Why | Fix |
|---|---|---|
| The token cannot write to this repository | The token is *Read-only*, or doesn't include this repository | Create a token with **Contents: Read and write** for this repository |
| GitHub did not let this token update the branch | The branch is protected | Click **Commit to a new branch**, then **Open pull request** |
| Rate limit used up | Without a token GitHub allows 60 requests an hour | Connect with a token, or wait until the time shown |
| The connection dropped | The commit may already be on GitHub | Click **Retry**: it checks first and never commits twice |

# Start here

This viewer turns a folder of Markdown (\`.md\`) files into API documentation with a clean three-column layout. You write plain text; the viewer does the layout. There is nothing to install and nothing to configure.

Every page in this guide works the same way: the **middle column shows the result**, and the **right column shows the Markdown that made it**. Copy any example with the **Copy** button.

### Three steps

1. Make a folder for your docs, for example \`my-docs\`.
2. Add \`.md\` files to it. Any text editor works (VS Code, Notepad, TextEdit…).
3. Open \`index.html\` in your browser, click **Choose docs folder**, and pick \`my-docs\`. When the browser asks **“Let site view files?”**, choose **View files**.

Only have one file? Click **Open a .md file** instead, or drag the file onto the page. You can also drag a whole folder.

Changed a file? Press the **↻ Reload** button in the top bar.

**New to it?** Read [the standard](01-basics/the-standard.md) (one page), start from a [template](01-basics/templates.md), and try things in the **[playground](#playground)**: write Markdown on the left and see the page on the right.

::: right Your folder
\`\`\`text
my-docs/
├── README.md              → "Introduction", first page
├── 01-getting-started/    → sidebar group "Getting Started"
│   ├── authentication.md
│   └── errors.md
└── 02-resources/          → sidebar group "Resources"
    ├── customers.md
    └── orders.md
\`\`\`
:::

::: right Smallest possible page: customers.md
\`\`\`\`markdown
# Customers

A customer is a person who buys from you.

## Get a customer
\`GET /v1/customers/:id\`

Returns one customer.

### Request

\`\`\`bash
curl https://api.example.com/v1/customers/cus_123
\`\`\`
\`\`\`\`
:::

## Cheat sheet

Everything the viewer understands, on one screen. Each row links to a page with a full example.

| You write | You get |
|---|---|
| a folder, e.g. \`02-resources/\` | a [group in the sidebar](01-basics/folders-and-files.md) (the number sets the order and is hidden) |
| a file, e.g. \`customers.md\` | a [page in the sidebar](01-basics/folders-and-files.md#files-become-pages) |
| \`# Customers\` on the first line | the [page title](01-basics/titles-and-sections.md) |

`,"../content/llm-prompt.md":'You write API documentation as Markdown files in **Doc Standard v1**, the format of the Mdocs viewer. The viewer turns a folder of these files into three-column docs: a sidebar, text in the middle, code on the right. Follow every rule below exactly; the viewer\'s doc checker flags anything else.\n\n# Folders and files\n\n- Each `.md` file is one page in the sidebar. Each folder is a sidebar group, named after the folder.\n- A number at the start of a folder or file name sets the order and is hidden: `01-about-the-api/`, `2-errors.md`. Dashes and underscores become spaces: `02-core-resources` → "Core Resources".\n- Page order: the `order:` setting, then the number in the file name, then A to Z.\n- `README.md` or `index.md` in the main folder is the first page, "Introduction". Files in the main folder (not in a subfolder) show at the top, without a group title.\n- `_meta.md` in a folder holds only settings (never shown as a page): `title` (group name) and `order` (group position). The `_meta.md` in the main folder can also set `site` and `version`.\n- **Resource folder** (layout A, one file per endpoint): a folder inside a group folder is one sidebar item. Its `index.md` (or `README.md`) is the overview; every other file is one section that starts with `# Section title` and writes its parts with `##`. Number the files to order them: `1-object.md`, `2-create.md`. Links to them look like `#customers/create`.\n- **One file per resource** (layout B): one file holds the overview and every section: `# Customers`, then `## The Customer object`, `## Create a customer`, … with `###` parts.\n- Images (png, jpg, gif, svg, webp) must be inside the docs folder. Folders starting with a dot and `node_modules` are skipped; other file types are ignored.\n\n```text\nmy-docs/\n├── README.md                  → "Introduction"\n├── _meta.md                   → site: / version:\n├── 01-about-the-api/          → group "About The API"\n│   ├── _meta.md               → title: About the API\n│   ├── 1-authentication.md\n│   └── 2-errors.md\n└── 02-core-resources/\n    ├── charges.md             → layout B\n    └── customers/             → layout A, sidebar item "Customers"\n        ├── index.md           → overview + Endpoints list (made for you)\n        ├── 1-object.md        → # The Customer object\n        └── 2-create.md        → # Create a customer\n```\n\n# Page settings (frontmatter)\n\nOptional. Only when you need to change what the viewer works out itself. The first `---` must be the very first line of the file (not even an empty line before it). One `key: value` per line; text after `#` is a comment.\n\n| Key | Where | What it does |\n|---|---|---|\n| `title` | any page, `_meta.md` | Page or group name (instead of the first `#` heading) |\n| `order` | any page, `_meta.md` | Position; smaller first |\n| `group` | any page | Puts the page in this group, whatever its folder |\n| `slug` | any page | The page\'s name in links: `slug: pets` gives `#pets/...` |\n| `site` | main `README.md` or main `_meta.md` | Site name at the top left |\n| `version` | main `README.md` or main `_meta.md` | Version label in the top bar |\n\nNo other keys exist.\n\n```markdown\n---\ntitle: Orders      # name in the sidebar\norder: 3\n---\n# Orders\n```\n\n# Titles and sections\n\n- The first `# heading` is the page title (sidebar, search, top of page). Without one, the file name is used: `list-pets.md` → "List Pets". Text before the first `##` is the page introduction.\n- Every `##` starts a **section**: one row with text in the middle and code on the right, its own sidebar item and link (`#customers/create-a-customer`). A later `#` heading also starts a section.\n- No two sections in one page may have the same title.\n- Write headings with `#`; never underline them with `===` or `---`.\n- **Part headings** never start a section, at any level. They switch on a layout for what follows. Case does not matter; a trailing `:` is fine:\n\n| Part heading | Effect |\n|---|---|\n| `Parameters` | The next bullet list becomes parameter rows |\n| `Attributes`, `Properties`, `Fields`, `Arguments` | Same, for the fields of an object |\n| `Query parameters`, `Path parameters`, `Body parameters`, `Headers`, `Request body` | Same, with that title |\n| `More parameters` / `More attributes` | A collapsed list (less-used items) |\n| `Returns` | A Returns block |\n| `Response`, `Example response` | The next code blocks become the Response box |\n| `Request`, `Example`, `Examples` | Hidden; the code under it goes to the code column |\n| `Endpoints` | Hidden; made for you on overview pages, never write it |\n\n- **Heading levels:** in a file with one section (layout A), parts are `##` (and `### Response` under `## Request`). In a page with many sections, sections are `##` and parts are `###`. Any other `###`/`####` is a normal smaller heading.\n- **Section order:** `# Title`, the `` `METHOD /path` `` line, a one-sentence description, `## Request` (code in every language), `### Response`, `## Parameters`, `## More parameters`, `## Returns`.\n\n# Endpoints\n\n- Put the method and path on the **first line right after** the section heading: `` `POST /v1/pets` ``. Methods: `GET`, `POST`, `PUT`, `PATCH`, `DELETE`, `HEAD`, `OPTIONS`. Path variables: `:id` or `{id}`. Anywhere else the line is plain text.\n- The first paragraph after it is the description. Keep its first sentence short: search shows it.\n- Every endpoint needs a request example (at least cURL) and a Response.\n- Overview pages get an **Endpoints** list on the right automatically (in a resource folder always; on a page with two or more endpoints). Don\'t write it.\n\n# Code\n\n- Every fenced code block goes to the right column automatically. Start the fence at the beginning of the line, never indented inside a list (it would stay in the middle). Close every fence.\n- **Tabs:** code blocks one after another, with nothing between them and each in a different language, become one box with language tabs.\n- Language names: `curl` or `bash`/`sh`/`shell` (a block starting with `curl` is labelled cURL), `js`/`javascript`/`node`, `ts`/`typescript`, `python`/`py`, `ruby`/`rb`, `php`, `go`, `java`, `csharp`/`cs`/`dotnet`, `json`, `yaml`/`yml`, `markdown`/`md`, `text` (no colors). Other names work and are shown capitalized.\n- **Box title:** ```` ```bash title="Create a pet" ````. A block with a title always starts a new box, so don\'t give titles to blocks meant to be tabs.\n- **Response:** every code block after a `Response` heading (until the next heading) goes in the Response box. Several possible responses: give each a title and they become tabs: ```` ```json title="200" ```` and ```` ```json title="404" ````.\n- **Numbered steps:** write a numbered step, then its code block directly under it (no blank line needed). The box shows the step\'s number. Text between two code blocks keeps them in separate boxes.\n- `::: left` … `:::` keeps a code block in the middle text instead of the right column.\n- Boxes longer than 26 lines are collapsed with an Expand button; that is fine.\n\n````markdown\n1. Find the rows without a user\n```sql\nselect * from user_groups where user_id is null;\n```\n\n2. Delete them\n```sql\ndelete from user_groups where user_id is null;\n```\n````\n\n# Parameters\n\nOne bullet per parameter: the name in backticks, the details in brackets, the description on the next line indented 2 spaces. Leave an empty line between parameters.\n\n```markdown\n## Parameters\n\n- `amount` (integer, required)\n  Amount in cents.\n\n- `address` (object, required if calculating taxes)\n  The billing address.\n\n  - `address.city` (string, optional)\n    City or town.\n\n  - `address.location` (object, optional)\n    Map position.\n\n    - `address.location.lat` (number, optional)\n      Latitude.\n\n- `customer` (string, optional, nullable, expandable)\n  The customer\'s ID.\n\n- `source` (string, optional, deprecated)\n  Use `payment_method` instead.\n\n- `status` (enum, optional)\n  Where the order is now.\n  Possible enum values:\n  - `pending`\n    Waiting for payment.\n  - `paid`\n\n## More parameters\n\n- `locale` (string, optional)\n  Preferred language, like `en` or `fr`.\n```\n\n- In the brackets: the **type** first (always give one), then `required`, `required if …`, `recommended if …` or `optional`, then any of `nullable`, `expandable`, `deprecated`, `read-only`, `beta`, separated by commas.\n- **Child parameters:** indent 2 spaces under the parent and write the full dotted name (`address.city`, `address.location.lat`), as deep as needed.\n- **Enums:** type `enum`, the description, then a line `Possible enum values:` and one bullet per value; a value may have its own description on the next line, indented.\n- Less-used parameters go under `More parameters` (collapsed).\n- **Objects:** describe fields under `Attributes` / `More attributes`, put an example object under `Response`, and leave out `optional`: `` - `id` (string) ``.\n- No parameters: write a sentence under the heading, such as `No parameters.`\n- Never use the older one-line styles (`` - `email` string, required — The email. `` or `- **email** (string): …`).\n\n# The right column\n\n`::: right Title` … `:::` moves anything to the right column as a card with that title: a table, a list, a note, an image. A code block inside it becomes a code box with that title (for example a Base URL box). Close every `:::`.\n\n````markdown\n::: right Base URL\n```text\nhttps://api.example.com\n```\n:::\n````\n\n# Text\n\n- Notes: `> [!NOTE]`, `> [!TIP]`, `> [!WARNING]`, `> [!IMPORTANT]`, `> [!CAUTION]` on the first quote line, the text on the following `> ` lines. With your own title: `::: note Title`, `::: tip Title`, `::: warning Title` … `:::`. Also `> **Warning:** text`.\n- Tables with `|`; the second line `|---|` marks the header; `:` sets alignment (`:-:`).\n- Bullets `-` (indent 2 spaces to nest), numbered `1.`, tasks `- [x]` / `- [ ]`.\n- `**bold**`, `*italic*`, `~~crossed out~~`, `` `inline code` ``; plain URLs become links.\n- Links are relative to the current file: `[Errors](errors.md)`, `[Errors](../01-about-the-api/errors.md)`, `[Create](customers.md#create-a-customer)`, `[see below](#section-name)`, `[Site](https://example.com)`. A section\'s anchor is its title in lower case with dashes.\n- Images, relative to the page, with alt text: `![Diagram: your server calls the API](../images/flow.svg)`.\n- HTML: `<details>` + `<summary>` for a toggle, with an empty line after `</summary>` and before `</details>`; inline `<kbd>`, `<sub>`, `<sup>`, `<mark>`, `<br>` (line break in a table cell). Close every HTML block. Never use `<script>`, `<style>`, `<iframe>`, or `style`/`class`/`on…` attributes. `\x3C!-- comments -->` are hidden.\n- A line `---` after an empty line is a divider. An empty line starts a new paragraph.\n\n# Kinds of pages\n\n- **Endpoint**: `# Create a pet`, endpoint line, description, `## Request`, `### Response`, `## Parameters`, `## More parameters`, `## Returns`.\n- **Object**: `# The Pet object`, `## Response` with an example object, `## Attributes`, `## More attributes`. Start each resource with it.\n- **Resource overview** (`index.md`): `# Pets` and a short introduction; the Endpoints list is made for you.\n- **Resource on one page**: `# Pets`, an introduction, then one `##` section per endpoint with `###` parts.\n- **Topic page** (Authentication, Errors, Pagination): text, notes and tables; example code under `## Example` goes to the right.\n- **How-to steps** (Install, Troubleshooting): numbered steps, each with its code block directly under it.\n\n# Complete example (one page, many sections)\n\n````markdown\n# Pets\n\nA pet is an animal that belongs to one of your customers.\n\n## Get a pet\n`GET /v1/pets/:id`\n\nRetrieves one pet by its ID.\n\n### Request\n\n```curl\ncurl https://api.example.com/v1/pets/pet_1 \\\n  -u YOUR_API_KEY:\n```\n\n```node\nconst pet = await client.pets.retrieve(\'pet_1\');\n```\n\n```python\npet = client.pets.retrieve("pet_1")\n```\n\n### Response\n\n```json title="200"\n{ "id": "pet_1", "name": "Milo", "species": "cat" }\n```\n\n```json title="404"\n{ "error": { "type": "not_found", "message": "No such pet: pet_9" } }\n```\n\n### Parameters\n\n- `id` (string, required)\n  The ID of the pet.\n\n### Returns\n\nThe pet object, or a `404` error if no pet has this ID.\n````\n\n# Your answer\n\nReply with only the Markdown. For several files, put each file\'s path (for example `02-core-resources/pets.md`) on its own line before its content.\n',"../content/templates/endpoint.md":`# Create a pet
\`POST /v1/pets\`

Creates a new pet for one of your customers.

## Request

\`\`\`curl
curl https://api.example.com/v1/pets \\
  -u YOUR_API_KEY: \\
  -d name=Milo \\
  -d species=cat
\`\`\`

\`\`\`node
const pet = await client.pets.create({ name: 'Milo', species: 'cat' });
\`\`\`

\`\`\`python
pet = client.pets.create(name="Milo", species="cat")
\`\`\`

### Response

\`\`\`json
{
  "id": "pet_1",
  "object": "pet",
  "name": "Milo",
  "species": "cat"
}
\`\`\`

## Parameters

- \`name\` (string, required)
  The pet's name.

- \`species\` (enum, optional)
  What kind of animal it is.
  Possible enum values:
  - \`cat\`
  - \`dog\`
  - \`bird\`

- \`owner\` (object, optional)
  Who looks after the pet.

  - \`owner.name\` (string, optional)
    The owner's full name.

  - \`owner.email\` (string, optional)
    The owner's email address.

## More parameters

- \`metadata\` (map, optional)
  Key-value pairs you can attach to the pet.

## Returns

The Pet object, if the call succeeded.
`,"../content/templates/howto.md":`# Troubleshooting

Fixes for common problems. Each fix is a numbered list of steps, with the code for each step right under it.

## Open a database shell

Every fix below runs in this shell.

\`\`\`bash
sudo docker exec -it app_db psql -U app -d app
\`\`\`

## Delete group rows without a user

A row in \`user_groups\` can point to a user that was deleted. Such rows break the group pages.

1. Find the rows without a user
\`\`\`sql
select * from user_groups where user_id is null;
\`\`\`

2. Delete them
\`\`\`sql
delete from user_groups where user_id is null;
\`\`\`

3. Check that none are left
\`\`\`sql
select count(*) from user_groups where user_id is null;
\`\`\`

> [!TIP]
> Keep a step between two code blocks. Code blocks with nothing between them become tabs of one box.

# Pets

A pet is an animal that belongs to one of your customers. Use the Pets API to create, update and list them.

> [!TIP]
> The **Endpoints** list on the right is made for you from the endpoint files in this folder. The playground shows one file only, so it stays empty here; pick *Resource on one page* to see it.
`,"../content/templates/resource.md":`# Pets

A pet is an animal that belongs to one of your customers. Use the Pets API to create, update and list them.

> [!TIP]
> This page has two or more endpoints, so the **Endpoints** list on the right is made for you from the sections below.

## Create a pet
\`POST /v1/pets\`

Creates a new pet for one of your customers.

### Request

\`\`\`curl
curl https://api.example.com/v1/pets \\
  -u YOUR_API_KEY: \\
  -d name=Milo
\`\`\`

## Update a pet
\`POST /v1/pets/:id\`

Updates the pet by setting the values of the parameters passed.

### Request

\`\`\`curl
curl https://api.example.com/v1/pets/pet_123 \\
  -u YOUR_API_KEY: \\
  -d name=Luna
\`\`\`

## Retrieve a pet
\`GET /v1/pets/:id\`

Retrieves the details of an existing pet.

### Request

\`\`\`curl
curl https://api.example.com/v1/pets/pet_123 \\
  -u YOUR_API_KEY:
\`\`\`

## List all pets
\`GET /v1/pets\`

Returns a list of your pets, newest first.

### Request

\`\`\`curl
curl https://api.example.com/v1/pets \\
  -u YOUR_API_KEY:
\`\`\`

## Delete a pet
\`DELETE /v1/pets/:id\`

Permanently deletes a pet. It cannot be undone.

### Request

\`\`\`curl
curl https://api.example.com/v1/pets/pet_123 \\
  -u YOUR_API_KEY: \\
  -X DELETE
\`\`\`
`,"../content/templates/topic.md":`# Authentication

The API uses API keys to authenticate requests. Send your secret key as the username with HTTP Basic Auth.

## Example

\`\`\`curl
curl https://api.example.com/v1/pets \\
  -u YOUR_API_KEY:
\`\`\`

> [!WARNING]
